name: Build Modern PDF Reader

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Qt6 and Poppler
        run: |
          sudo apt update
          sudo apt install -y \
            qt6-base-dev \
            libpoppler-qt6-dev \
            cmake \
            build-essential

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake ..

      - name: Build Project
        run: |
          cd build
          cmake --build .
