name: Build Modern PDF Reader

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

jobs:

  # ─────────────────────────────
  # Windows Build
  # ─────────────────────────────
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.6.3
          arch: win64_msvc2019_64
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
    
      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: |
          cmake --build build
      
      - name: Deploy Qt DLLs
        run: |
          windeployqt build/ModernPDFReader.exe
      
      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: ModernPDFReader-Windows
          path: build
