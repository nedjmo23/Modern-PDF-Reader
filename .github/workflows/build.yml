name: Build Modern PDF Reader

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

jobs:

  # ─────────────────────────────
  # Linux Build
  # ─────────────────────────────
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            qt6-base-dev \
            qt6-base-dev-tools \
            libpoppler-qt6-dev \
            cmake \
            ninja-build \
            build-essential

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja

      - name: Build Project
        run: |
          cmake --build build

      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: ModernPDFReader-Linux
          path: build


  # ─────────────────────────────
  # Windows Build
  # ─────────────────────────────
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.6.3
          arch: win64_mingw
          
      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja

      - name: Build Project
        run: |
          cmake --build build --config Release
      
      - name: Deploy Qt DLLs
        run: |
          windeployqt build/ModernPDFReader.exe
      
      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: ModernPDFReader-Windows
          path: build
